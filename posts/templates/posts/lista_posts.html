{% extends 'posts/base.html' %}

{% block content %}

<a href="{% url 'crear_post' %}">
    Crear nuevo post
</a>

<h2>Listado de publicaciones</h2>

{% for post in posts %}

<article>

    <h3>
        <a href="{% url 'detalle_post' post.id %}">
            {{ post.titulo }}
        </a>
    </h3>

    <p>{{ post.contenido|truncatewords:20 }}</p>

    {% if post.imagen %}
        <img
            src="{{ post.imagen.url }}"
            alt="{{ post.titulo }}"
            width="300"
        >
    {% endif %}

    <hr>

</article>

{% empty %}

<p>No existen publicaciones.</p>

{% endfor %}

{% endblock %}
