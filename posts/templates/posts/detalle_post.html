{% extends 'posts/base.html' %}

{% block content %}

<h2>{{ post.titulo }}</h2>

<p>{{ post.contenido }}</p>

<p>
    Autor: {{ post.autor }}
</p>

<p>
    Estado: {{ post.estado }}
</p>

{% if post.imagen %}

<img
    src="{{ post.imagen.url }}"
    width="400"
>

{% endif %}

<p>

    <a href="{% url 'editar_post' post.id %}">
        Editar
    </a>

    |

    <a href="{% url 'eliminar_post' post.id %}">
        Eliminar
    </a>

</p>

{% endblock %}
